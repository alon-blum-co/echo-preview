<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Echo העוזר הטלפוני</title>
</head><body style="margin:0">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* layout: לוח כהה; העמוד (הירו, סרטון, איך זה עובד, טופס) מוצג ברוחב מחשב וברוחב טלפון. שוליים קבועים לכל הסקשנים, Black מול Thin, בהיר וכהה מתחלפים לפי המותג */
@font-face{font-family:Discovery;src:url(fonts/discovery-Thin.woff2) format("woff2");font-weight:200;font-display:swap}
@font-face{font-family:Discovery;src:url(fonts/discovery-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Discovery;src:url(fonts/discovery-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:Discovery;src:url(fonts/discovery-Black.woff2) format("woff2");font-weight:900;font-display:swap}
:root{
  --night:#050B1A;--navy:#0B1F4D;--surface:#0A1630;--line:#1C2D57;--blue:#1A5CFF;--signal:#3D8BFF;--sky:#8ED3FF;--ice:#EAF4FF;
  --text:#F4F8FF;--muted:#9DB0D6;--faint:#647AA8;
  --glow:linear-gradient(135deg,#1A5CFF,#3D8BFF 55%,#8ED3FF);
  --nightg:linear-gradient(160deg,#0B1F4D,#050B1A);
  --font:Discovery,"Assistant","Heebo",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--night);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.6;direction:rtl;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1400px;margin:0 auto;padding-block:40px 120px}
header.top{padding-bottom:26px;border-bottom:1px solid var(--line);margin-bottom:30px}
header.top h1{font-size:clamp(30px,4.2vw,50px);font-weight:900;line-height:1.05;margin:0 0 10px}
header.top p{color:var(--muted);margin:0;max-width:86ch}
.pair{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:26px;align-items:start}
.lbl{font-size:13px;color:var(--faint);margin-bottom:8px}
.sticky{position:sticky;top:16px}

/* ================= the page ================= */
.page{--g:8cqw;container-type:inline-size;container-name:pg;border-radius:18px;overflow:hidden;color:#0B1F4D;background:#FFFFFF;position:relative;isolation:isolate}
.page section{position:relative}
.rings{position:absolute;z-index:0;pointer-events:none;left:50%;transform:translate(-50%,-50%)}
.rings svg{width:100%;height:100%;overflow:visible}
.rings path{fill:none;stroke:#1A5CFF;stroke-width:1.2;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center;opacity:0;animation:echo 6.4s linear infinite}
.rings path:nth-child(2){animation-delay:1.6s}.rings path:nth-child(3){animation-delay:3.2s}.rings path:nth-child(4){animation-delay:4.8s}
@keyframes echo{0%{transform:scale(.3);opacity:0}10%{opacity:.3}100%{transform:scale(1);opacity:0}}

/* type: Black against Thin */
.eb{font-size:max(1.25cqw,12.5px);font-weight:700;color:#1A5CFF;letter-spacing:.01em}
.h1{margin:0;font-weight:900;letter-spacing:-.02em;color:#0B1F4D}
.h1 .l1{display:block;font-size:6.2cqw;line-height:1;font-weight:900}
.h1 .l2,.h2,.eb,.sub{text-wrap:balance}
.h1 .l2{display:block;font-size:3.1cqw;line-height:1.15;margin-top:.8cqw;font-weight:200;letter-spacing:-.01em}
.grad{background:var(--glow);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0;font-size:max(1.4cqw,14px);line-height:1.6;color:#1C2D57;font-weight:400}
.sub b{font-weight:700;color:#0B1F4D}
.h2{margin:0;font-size:3.3cqw;line-height:1.12;letter-spacing:-.015em;color:#0B1F4D;font-weight:900}
.h2 .th{font-weight:200}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:.8cqw;font-size:max(1.3cqw,14px);font-weight:700;color:#fff;background:var(--glow);border-radius:999px;padding:1.15cqw 2.8cqw;
  box-shadow:0 1.2cqw 3cqw -1cqw #1A5CFF99,0 0 0 1px #ffffff33 inset;white-space:nowrap;position:relative;overflow:hidden;border:0;font-family:inherit;cursor:pointer}
.cta::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,#ffffff55 50%,transparent 65%);background-size:250% 100%;animation:shine 4s ease-in-out infinite}
@keyframes shine{0%,55%{background-position:130% 0}100%{background-position:-30% 0}}
.offer{display:inline-flex;align-items:center;gap:.6cqw;font-size:max(1.15cqw,12.5px);font-weight:700;color:#0B1F4D}
.offer i{width:.7cqw;height:.7cqw;border-radius:50%;background:#1A5CFF;box-shadow:0 0 0 .35cqw #1A5CFF22}
.nav{position:relative;z-index:5;height:6cqw;display:flex;justify-content:space-between;align-items:center;padding:0 var(--g)}
.nav .lg{display:flex;align-items:center;gap:.7cqw;font-weight:900;font-size:1.7cqw}
.nav .lg img{width:2.6cqw;display:block}
.nav .links{display:flex;gap:2.4cqw;font-size:max(1.05cqw,12.5px);color:#1C2D57}
.nav .nb{font-size:max(1.05cqw,12.5px);font-weight:700;border-radius:999px;padding:.65cqw 1.5cqw;color:#fff;background:#0B1F4D}

/* Echo logo character with the brand expressions */
.ch{overflow:visible;display:block}
.ch .x{transition:opacity .25s}
.ch .body{transform-box:fill-box;transform-origin:50% 90%;animation:pop .7s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
.ch .eyeL,.ch .eyeR,.ch .eyes,.ch .ring,.ch .dot{transform-box:fill-box;transform-origin:center}
.ch.s-look .open .eyes{animation:look 2.6s ease-in-out infinite}
.ch.s-blink .open .eyeL,.ch.s-blink .open .eyeR{animation:blink 2.8s infinite}
.ch .tk,.ch .hp,.ch .rg{opacity:0}
.ch.s-think .open{opacity:0}.ch.s-think .tk{opacity:1}
.ch.s-think .tk .eyes{animation:think 2s ease-in-out infinite}
.ch.s-think .tk .dot{animation:dot 1.1s infinite}.ch.s-think .tk .dot:nth-child(2){animation-delay:.18s}.ch.s-think .tk .dot:nth-child(3){animation-delay:.36s}
.ch.s-happy .open{opacity:0}.ch.s-happy .hp{opacity:1}
.ch.s-happy .hp .eyes{animation:bob 1.6s ease-in-out infinite}
.ch.s-rec .rg{opacity:1}
.ch.s-rec .rg .ring{animation:ring 2s ease-out infinite}.ch.s-rec .rg .ring:nth-child(2){animation-delay:1s}
@keyframes look{0%,30%{transform:translateX(0)}40%,70%{transform:translateX(34px)}80%,100%{transform:translateX(0)}}
@keyframes blink{0%,44%,52%,100%{transform:scaleY(1)}48%{transform:scaleY(.08)}}
@keyframes think{0%,100%{transform:translate(0,0)}50%{transform:translate(-18px,-16px)}}
@keyframes dot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-8px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.35);opacity:0}}
@keyframes breathe{50%{opacity:.4}}
@keyframes wave{0%,100%{height:25%}50%{height:100%}}
@keyframes kb{to{transform:scale(1.06)}}

/* ---------- 1. HERO (light, ice) ---------- */
.hero{background:linear-gradient(180deg,#FFFFFF 0%,#F4F9FF 45%,#EAF4FF 100%);overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#1C2D57 .09cqw,transparent .12cqw);background-size:2.2cqw 2.2cqw;opacity:.12;
  -webkit-mask:radial-gradient(70% 55% at 50% 35%,#000,transparent 85%);mask:radial-gradient(70% 55% at 50% 35%,#000,transparent 85%)}
.hero .copy{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;gap:1.3cqw;padding:4cqw var(--g) 0}
.hero .eb{max-width:44cqw}
.hero .sub{max-width:52cqw}
.hero .row{display:flex;align-items:center;gap:2cqw;margin-top:.8cqw}
/* the panel: the logo between two real cards from the app (the reference Alon chose) */
.panel{position:relative;z-index:1;margin:8cqw var(--g) 0;height:27cqw;border-radius:2.8cqw 2.8cqw 0 0;background:linear-gradient(180deg,#0B1F4D,#050B1A);box-shadow:0 -2cqw 5cqw -3cqw #0B1F4D80}
.panel::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(34% 70% at 50% 0%,#2E7BFF59,transparent 70%);pointer-events:none}
.panel::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 1px #1C2D57 inset;pointer-events:none;-webkit-mask:linear-gradient(#000 60%,transparent);mask:linear-gradient(#000 60%,transparent)}
.mascot{position:absolute;z-index:4;left:50%;top:-5.4cqw;width:10.5cqw;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.9cqw}
.mascot .ch{width:100%;filter:drop-shadow(0 1.4cqw 2cqw #050B1A99)}
.cap{position:relative;height:2.4cqw;width:26cqw}
.cap span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:.6cqw;white-space:nowrap;font-size:max(1.1cqw,12.5px);color:#9DB0D6;opacity:0;transform:translateY(.5cqw);transition:opacity .35s,transform .35s}
.cap span b{color:#F4F8FF;font-weight:700}
.cap span i{width:.7cqw;height:.7cqw;border-radius:50%;background:#8ED3FF;box-shadow:0 0 0 .35cqw #8ED3FF33;animation:breathe 1.3s infinite}
[data-phase=rec] .cap .c-rec,[data-phase=think] .cap .c-think,[data-phase=happy] .cap .c-happy,[data-phase=look] .cap .c-look{opacity:1;transform:none}
.vlink{position:absolute;z-index:4;left:50%;top:13.6cqw;transform:translateX(-50%);display:flex;align-items:center;gap:.9cqw;font-size:max(1.1cqw,12.5px);font-weight:700;color:#F4F8FF;white-space:nowrap;
  background:#ffffff12;border:1px solid #ffffff26;border-radius:999px;padding:.5cqw 1.5cqw .5cqw .5cqw}
.vlink .pl{width:2.4cqw;height:2.4cqw;border-radius:50%;background:var(--glow);display:grid;place-items:center}
.vlink .pl::after{content:"";border-style:solid;border-width:.45cqw 0 .45cqw .75cqw;border-color:transparent transparent transparent #fff;margin-left:.15cqw}
/* real app cards, readable size */
.acard{position:absolute;z-index:3;top:4cqw;width:22.5cqw;border-radius:1.6cqw;transition:opacity .5s,transform .5s}
.a-call{right:3cqw}
.a-sug{left:3cqw}
.a-call .st{position:relative;padding:1.5cqw 1.6cqw;border-radius:inherit;background:linear-gradient(160deg,#122a63,#0A1630);border:1px solid #2a4580;box-shadow:0 2.4cqw 4cqw -2cqw #000c;color:#F4F8FF}
.a-call .meta{font-size:.92cqw;color:#9DB0D6;direction:rtl}
.a-call .nm{font-size:1.75cqw;font-weight:900;margin-top:.3cqw;letter-spacing:-.01em}
.a-call hr{border:0;height:1px;background:#ffffff1f;margin:1.1cqw 0}
.a-call .lab{font-size:.92cqw;font-weight:700;color:#8ED3FF}
.a-call .nx{font-size:max(1.35cqw,14px);font-weight:700;margin-top:.2cqw}
.a-call .nx small{display:block;font-size:max(1.02cqw,12.5px);font-weight:400;color:#9DB0D6;margin-top:.15cqw}
.a-call .btns{display:grid;grid-template-columns:1.5fr 1fr;gap:.7cqw;margin-top:1.2cqw}
.a-call .btns span{display:flex;align-items:center;justify-content:center;gap:.5cqw;font-size:max(1.02cqw,12.5px);font-weight:700;border-radius:.9cqw;padding:.8cqw}
.a-call .btns .b1{background:var(--glow);color:#fff}
.a-call .btns .b2{border:1px solid #ffffff33;color:#F4F8FF}
.a-call .live{position:absolute;inset:0;opacity:0;padding:1.5cqw 1.6cqw;border-radius:inherit;background:linear-gradient(160deg,#122a63,#0A1630);border:1px solid #2a4580;display:flex;flex-direction:column;gap:.7cqw;transition:opacity .5s}
.a-call .live .lh{display:flex;align-items:center;gap:.6cqw;font-size:max(1.02cqw,12.5px);font-weight:700;color:#8ED3FF}
.a-call .live .lh i{width:.7cqw;height:.7cqw;border-radius:50%;background:#8ED3FF;animation:breathe 1.3s infinite}
.a-call .live .lh em{margin-inline-start:auto;font-style:normal;color:#9DB0D6;font-weight:400;font-variant-numeric:tabular-nums}
.a-call .live .nm{margin:0}
.a-call .live .q{font-size:max(1.15cqw,12.5px);line-height:1.5;color:#C9D7F2}
.a-call .live .q b{color:#8ED3FF;margin-inline-end:.4cqw}
.a-call .live .wv{display:flex;gap:.35cqw;align-items:center;height:2.6cqw;margin-top:auto}
.a-call .live .wv i{flex:1;max-width:.4cqw;border-radius:1cqw;background:var(--glow);animation:wave 1.1s ease-in-out infinite}
[data-phase=rec] .a-call .live,[data-phase=think] .a-call .live{opacity:1}
[data-phase=think] .a-call .live .wv i{animation-play-state:paused;opacity:.4}
.a-sug{background:#FFFFFF;padding:1.3cqw 1.5cqw;box-shadow:0 2.4cqw 4cqw -2cqw #000c,0 0 0 1px #1A5CFF1f;color:#0B1F4D;opacity:0;transform:translateY(1.2cqw) scale(.97)}
[data-phase=happy] .a-sug,[data-phase=look] .a-sug{opacity:1;transform:none}
.a-sug .sh{font-size:.92cqw;font-weight:700;color:#647AA8}
.a-sug .sr{display:grid;grid-template-columns:2cqw 1fr auto;gap:.8cqw;align-items:start;margin-top:.9cqw}
.a-sug .sr svg{width:2cqw;height:2cqw;fill:none;stroke:#1A5CFF;stroke-width:1.7;stroke-linecap:round}
.a-sug .sr b{display:block;font-size:max(1.3cqw,14px);font-weight:900;line-height:1.25}
.a-sug .sr small{display:block;font-size:max(1cqw,12.5px);color:#647AA8;margin-top:.2cqw}
.a-sug .chip{font-size:.85cqw;font-weight:700;border-radius:999px;padding:.25cqw .8cqw;background:#EAF4FF;color:#1A5CFF;white-space:nowrap}
.a-sug .qt{font-size:max(1.05cqw,12.5px);color:#1C2D57;margin:.8cqw 0 0;padding-inline-start:2.8cqw}
.a-sug .sb{display:flex;align-items:center;gap:1.4cqw;margin-top:1cqw;padding-inline-start:2.8cqw}
.a-sug .sb .ok{font-size:max(1.02cqw,12.5px);font-weight:700;color:#fff;background:#1A5CFF;border-radius:999px;padding:.55cqw 1.4cqw;transition:background .3s}
.a-sug .sb .no{font-size:max(1.02cqw,12.5px);color:#647AA8}
.a-sug .done-t{display:none}
[data-phase=look] .a-sug .sb .ok{background:#0B1F4D}
[data-phase=look] .a-sug .sb .ok .todo{display:none}[data-phase=look] .a-sug .sb .ok .done-t{display:inline}
[data-phase=look] .a-sug .chip{background:#0B1F4D;color:#fff}

/* ---------- 2. VIDEO (dark, the hero panel opens into it) ---------- */
.video{padding:6cqw var(--g) 13cqw;display:flex;flex-direction:column;align-items:center;text-align:center;color:#F4F8FF;
  background:radial-gradient(40% 35% at 50% 40%,#2E7BFF26,transparent 70%),linear-gradient(180deg,#050B1A 0%,#0B1F4D 55%,#050B1A 100%)}
.video .h2{color:#F4F8FF;max-width:60cqw}
.player{position:relative;width:54cqw;aspect-ratio:16/9;margin-top:3cqw;border-radius:2.2cqw;overflow:hidden;background:var(--nightg);cursor:pointer;
  box-shadow:0 0 0 1px #1C2D57,0 0 7cqw -2cqw #1A5CFF80,0 4cqw 8cqw -3cqw #000}
.player .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 20s ease-in-out infinite alternate}
.player .prings{position:absolute;left:66.5%;top:44%;width:38%;aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none}
.player .prings svg{width:100%;height:100%;overflow:visible}
.player .prings path{fill:none;stroke:#8ED3FF;stroke-width:1.4;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center;opacity:0;animation:echo2 4.5s ease-out infinite}
.player .prings path:nth-child(2){animation-delay:1.5s}.player .prings path:nth-child(3){animation-delay:3s}
@keyframes echo2{0%{transform:scale(.75);opacity:0}15%{opacity:.5}100%{transform:scale(1.7);opacity:0}}
.player .pbtn{position:absolute;left:24%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:1.1cqw;color:#F4F8FF;font-size:max(1.2cqw,12.5px);font-weight:700;white-space:nowrap;text-align:right}
.player .pbtn .pl{width:4.4cqw;height:4.4cqw;border-radius:50%;background:#ffffff1f;border:1px solid #ffffff40;backdrop-filter:blur(10px);display:grid;place-items:center;animation:pulse 2.4s ease-out infinite;transition:background .2s}
.player:hover .pbtn .pl{background:#ffffff33}
.player .pbtn .pl::after{content:"";border-style:solid;border-width:.85cqw 0 .85cqw 1.35cqw;border-color:transparent transparent transparent #fff;margin-left:.3cqw}
@keyframes pulse{0%{box-shadow:0 0 0 0 #8ED3FF66}100%{box-shadow:0 0 0 1.6cqw #8ED3FF00}}
.player .pbtn small{display:block;font-size:.95cqw;font-weight:400;color:#C9D7F2}
.player .tl{position:absolute;left:2cqw;right:2cqw;bottom:1.6cqw;display:flex;align-items:center;gap:1cqw;font-size:.9cqw;color:#C9D7F2;font-variant-numeric:tabular-nums}
.player .tl .tr{flex:1;height:.3cqw;border-radius:1cqw;background:#ffffff26;overflow:hidden}
.player .tl .tr i{display:block;height:100%;width:0;background:var(--glow);animation:prog 12.2s linear infinite}
@keyframes prog{to{width:100%}}
.feats{display:grid;grid-template-columns:repeat(3,1fr);width:100%;margin-top:4cqw;text-align:right}
.feat{padding:0 2.6cqw}
.feat+.feat{border-right:1px solid #8ED3FF2e}
.feat h3{margin:0;font-size:max(1.45cqw,14px);font-weight:700;color:#FFFFFF}
.feat p{margin:.6cqw 0 0;font-size:max(1.08cqw,12.5px);line-height:1.6;color:#EAF4FF;font-weight:200}
.video .cta{margin-top:4cqw}
.tools{margin-top:4.6cqw;display:flex;flex-direction:column;align-items:center;gap:1.6cqw}
.tools .lt{font-size:max(1cqw,12.5px);font-weight:500;color:#EAF4FFcc}
.tools .row{display:flex;justify-content:center;gap:2.8cqw}
.app{display:flex;flex-direction:column;align-items:center;gap:.7cqw;width:5.4cqw}
.app i{position:relative;width:3.9cqw;height:3.9cqw;border-radius:1cqw;display:grid;place-items:center;overflow:hidden;
  box-shadow:0 1.2cqw 2.2cqw -1cqw #000,0 0 0 1px #ffffff1f inset,0 .15cqw 0 #ffffff40 inset}
.app i::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#ffffff38,transparent 48%)}
.app img{width:55%;height:55%;position:relative}
.app small{font-size:.88cqw;color:#EAF4FFcc;white-space:nowrap}

/* ---------- 2b. HOW IT WORKS: a real iPhone call, then Echo ---------- */
.how{position:relative;padding:5cqw 8cqw 6cqw;display:grid;grid-template-columns:1fr 30cqw;gap:6cqw;align-items:center;overflow:visible;
  background:linear-gradient(180deg,#FFFFFF 0%,#F4F9FF 60%,#EAF4FF 100%)}
.how::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#1C2D57 .09cqw,transparent .12cqw);background-size:2.2cqw 2.2cqw;opacity:.12;
  -webkit-mask:radial-gradient(40% 60% at 22% 50%,#000,transparent 80%);mask:radial-gradient(40% 60% at 22% 50%,#000,transparent 80%)}
.how .rings{left:23%;top:50%;width:70cqw;height:70cqw}
.how .hc{display:flex;flex-direction:column;gap:1.6cqw}
.how .h2{font-size:3.4cqw;max-width:44cqw}
.steps{list-style:none;margin:1.4cqw 0 0;padding:0;display:flex;flex-direction:column;gap:.4cqw;position:relative}
.step{display:grid;grid-template-columns:3.4cqw 1fr;gap:0 1.4cqw;padding:1.1cqw 0;opacity:.42;transition:opacity .45s}
.step .sn{grid-row:1/3;width:3.4cqw;height:3.4cqw;border-radius:50%;display:grid;place-items:center;font-size:max(1.15cqw,12.5px);font-weight:900;color:#1A5CFF;background:#EAF4FF;border:1px solid #1A5CFF33;transition:all .45s}
.step h3{margin:0;font-size:max(1.55cqw,14px);font-weight:900;color:#0B1F4D;line-height:1.3}

  .fld input:focus+label,.fld input:not(:placeholder-shown)+label{top:min(2.4cqw,9.8px);font-size:min(2.8cqw,11.5px)}

  .done h3{font-size:min(6.4cqw,26.2px)}.done p{font-size:min(3.8cqw,15.6px)}
}

/* ---------- notes ---------- */
.fb{margin-top:40px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px}
.fb h2{margin:0 0 6px;font-size:26px;font-weight:900}
.fb p{margin:0 0 14px;color:var(--muted)}
.fb textarea{width:100%;min-height:96px;font:inherit;color:var(--text);background:var(--night);border:1px solid var(--line);border-radius:14px;padding:12px 14px;resize:vertical}
.fb .row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:14px}
.fb .send{font:inherit;font-weight:900;font-size:17px;color:#fff;border:0;border-radius:999px;padding:13px 28px;cursor:pointer;background:var(--glow)}
.fb .st{color:var(--muted);font-size:14px}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
@media (max-width:980px){.pair{grid-template-columns:1fr}.pair>div:last-child{max-width:360px;margin-inline:auto;width:100%}.sticky{position:static}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ================= options board ================= */
.opt{margin-top:70px}
.oh{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:baseline;margin-bottom:16px}
.oh .n{font-size:52px;font-weight:900;line-height:.9;color:transparent;-webkit-text-stroke:1.5px var(--signal)}
.oh h2{margin:0;font-size:clamp(22px,2.6vw,30px);font-weight:900;color:var(--text)}
.oh p{grid-column:2;margin:0;color:var(--muted);max-width:86ch}
.secT{margin:90px 0 0;padding-top:30px;border-top:1px solid var(--line);font-size:clamp(28px,3.6vw,42px);font-weight:900;color:var(--text)}
.secT small{display:block;font-size:16px;font-weight:400;color:var(--muted);margin-top:6px}
.page{border-radius:18px}

/* special flowing gradient for every button */
.cta{background:linear-gradient(100deg,#1A5CFF 0%,#3D8BFF 30%,#8ED3FF 50%,#3D8BFF 70%,#1A5CFF 100%);background-size:220% 100%;animation:flow 5s ease-in-out infinite;
  box-shadow:0 1.2cqw 3cqw -1cqw #1A5CFFaa,0 0 0 1px #ffffff40 inset,0 .2cqw 0 #ffffff55 inset}
@keyframes flow{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
.nav .nb{background:linear-gradient(100deg,#0B1F4D,#1A5CFF 60%,#0B1F4D);background-size:220% 100%;animation:flow 6s ease-in-out infinite}

/* ---------- HERO B: the tools orbit the logo ---------- */
.heroB{display:grid;grid-template-columns:1fr 40cqw;align-items:center;gap:3cqw;padding:0 var(--g) 5cqw;min-height:52cqw}
.heroB .nav{grid-column:1/-1;padding:0}
.heroB .copy{position:relative;z-index:2;display:flex;flex-direction:column;gap:1.3cqw;align-items:flex-start;text-align:right}
.heroB .h1 .l1{font-size:5.2cqw;white-space:nowrap}
.heroB .sub{max-width:40cqw}
.heroB .row{display:flex;align-items:center;gap:2cqw;margin-top:.6cqw}
.orbit{position:relative;aspect-ratio:1;border-radius:3cqw;background:radial-gradient(55% 55% at 50% 50%,#1A3F8F,#0B1F4D 55%,#050B1A);overflow:hidden;
  box-shadow:0 4cqw 8cqw -3cqw #0B1F4Daa,0 0 0 1px #1C2D57 inset}
.orbit::before{content:"";position:absolute;inset:0;background-image:radial-gradient(#8ED3FF .08cqw,transparent .11cqw);background-size:2cqw 2cqw;opacity:.2;-webkit-mask:radial-gradient(closest-side,#000,transparent);mask:radial-gradient(closest-side,#000,transparent)}
.orbit .core{position:absolute;left:50%;top:46%;width:13cqw;transform:translate(-50%,-50%);z-index:3}
.orbit .core::before{content:"";position:absolute;inset:-40%;background:radial-gradient(closest-side,#2E7BFF80,transparent);z-index:-1}
.orbit .core .ch{width:100%}
.orb{position:absolute;left:50%;top:46%;border-radius:50%;border:1px dashed #8ED3FF40;transform:translate(-50%,-50%) rotateX(62deg)}
.orb.o1{width:30cqw;height:30cqw}.orb.o2{width:40cqw;height:40cqw;border-style:solid;border-color:#8ED3FF26}
.sat{position:absolute;left:50%;top:46%;width:0;height:0;z-index:2}
.sat .app{position:absolute;width:auto;transform:translate(-50%,-50%)}
.sat .app i{width:4cqw;height:4cqw}
.sat .app small{display:none}
.orbit .cap2{position:absolute;left:50%;bottom:3.4cqw;transform:translateX(-50%);display:flex;align-items:center;gap:.6cqw;white-space:nowrap;font-size:max(1.05cqw,12.5px);color:#C9D7F2;background:#050B1Acc;border:1px solid #1C2D57;border-radius:999px;padding:.5cqw 1.3cqw;z-index:4}
.orbit .cap2 b{color:#fff}
.orbit .cap2 i{width:.7cqw;height:.7cqw;border-radius:50%;background:#8ED3FF;animation:breathe 1.3s infinite}
.flyc{position:absolute;z-index:5;right:-1.6cqw;top:5cqw;width:16cqw;background:#FFFFFF;border-radius:1.3cqw;padding:1cqw 1.2cqw;color:#0B1F4D;box-shadow:0 2cqw 4cqw -2cqw #000c;font-size:.98cqw;line-height:1.4;transition:opacity .5s,transform .5s;opacity:0;transform:translateY(1cqw)}
.flyc b{display:block;font-size:max(1.1cqw,12.5px)}
.flyc small{color:#647AA8}
[data-phase=happy] .flyc,[data-phase=look] .flyc{opacity:1;transform:none}
.flyc.f2{right:auto;left:-1.6cqw;top:auto;bottom:8cqw}

/* ---------- HERO C: the tools stream through the logo ---------- */
.heroC{padding:0 0 6cqw}
.heroC .copy{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;gap:1.3cqw;padding:4cqw var(--g) 0}
.heroC .sub{max-width:52cqw}
.heroC .row{display:flex;align-items:center;gap:2cqw;margin-top:.8cqw}
.stream{position:relative;margin-top:6cqw;height:12cqw;display:flex;align-items:center}
.stream .band{position:absolute;inset:2cqw 0;background:linear-gradient(90deg,transparent,#0B1F4D 18%,#0B1F4D 82%,transparent);-webkit-mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.stream .trk{position:relative;display:flex;gap:3.4cqw;width:max-content;animation:marq 22s linear infinite;direction:ltr;padding-inline:2cqw}
.stream .app i{width:4.6cqw;height:4.6cqw}
.stream .app small{color:#C9D7F2}
.stream .lens{position:absolute;z-index:3;left:50%;top:50%;width:15cqw;height:15cqw;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(closest-side,#0B1F4D 62%,#0B1F4D00);display:grid;place-items:center}
.stream .lens::before{content:"";position:absolute;inset:-25%;border-radius:50%;background:radial-gradient(closest-side,#2E7BFF66,transparent)}
.stream .lens .ch{width:10cqw;position:relative}
.stream .lens .rr{position:absolute;inset:0;border-radius:50%;border:1px solid #8ED3FF55;animation:ring 2.6s ease-out infinite}
.heroC .under{display:flex;justify-content:center;gap:2.2cqw;margin-top:2.4cqw;padding:0 var(--g)}
.heroC .under span{display:flex;align-items:center;gap:.7cqw;font-size:max(1.1cqw,12.5px);color:#1C2D57}
.heroC .under b{color:#0B1F4D}
.heroC .under i{width:2.2cqw;height:2.2cqw;border-radius:.6cqw;display:grid;place-items:center;background:#EAF4FF}
.heroC .under i svg{width:1.3cqw;height:1.3cqw;fill:none;stroke:#1A5CFF;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- VIDEO A: callouts around the player ---------- */
.vA{padding:5cqw var(--g) 6cqw}
.vA .grid3{position:relative;width:100%;margin-top:3cqw;display:grid;grid-template-columns:17cqw 1fr 17cqw;gap:0 3.4cqw;align-items:center}
.vA .player{grid-column:2;grid-row:1/4;width:100%;margin:0}
.vA .co{position:relative;display:flex;flex-direction:column;gap:.5cqw;text-align:right;padding:1.4cqw 0}
.vA .co.r{grid-column:1}.vA .co.l{grid-column:3}
.vA .co.c1{grid-row:1}.vA .co.c2{grid-row:3}.vA .co.c3{grid-row:2}
.vA .co .ic{width:3cqw;height:3cqw;border-radius:.9cqw;display:grid;place-items:center;background:#1A5CFF26;border:1px solid #3D8BFF55}

.vA .co::after{content:"";position:absolute;top:2.9cqw;width:2.6cqw;height:1px}
.vA .co.r::after{left:-3.2cqw;background:linear-gradient(270deg,#3D8BFF,transparent)}
.vA .co.l::after{right:-3.2cqw;background:linear-gradient(90deg,#3D8BFF,transparent)}
.vA .co::before{content:"";position:absolute;top:2.75cqw;width:.35cqw;height:.35cqw;border-radius:50%;background:#8ED3FF;box-shadow:0 0 .8cqw #8ED3FF}
.vA .co.r::before{left:-.6cqw}.vA .co.l::before{right:-.6cqw}

/* ---------- VIDEO C: wide studio frame ---------- */
.vC{padding:5cqw var(--g) 6cqw;align-items:stretch;text-align:right}
.wide{position:relative;width:100%;aspect-ratio:21/9;border-radius:2.6cqw;overflow:hidden;box-shadow:0 0 0 1px #1C2D57,0 4cqw 8cqw -3cqw #000;cursor:pointer}
.wide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 20s ease-in-out infinite alternate}
.wide::after{content:"";position:absolute;inset:0;background:linear-gradient(270deg,transparent 35%,#050B1Add 75%)}
.wide .in{position:absolute;z-index:2;left:3.4cqw;top:50%;transform:translateY(-50%);width:25cqw;display:flex;flex-direction:column;gap:1.4cqw;align-items:flex-start}
.wide .h2{color:#fff;font-size:2.9cqw}
.wide .pbtn{display:flex;align-items:center;gap:1.1cqw;color:#fff;font-size:max(1.2cqw,12.5px);font-weight:700}
.wide .pbtn .pl{width:4.4cqw;height:4.4cqw;border-radius:50%;background:#ffffff1f;border:1px solid #ffffff40;backdrop-filter:blur(10px);display:grid;place-items:center;animation:pulse 2.4s ease-out infinite}

.wide .pbtn small{display:block;font-size:.95cqw;font-weight:400;color:#C9D7F2}
.wide .slot{position:absolute;z-index:2;right:2cqw;bottom:2cqw;font-size:.9cqw;color:#C9D7F2;border:1px dashed #8ED3FF66;border-radius:999px;padding:.4cqw 1.1cqw;background:#050B1A99}
.vC .feats{margin-top:3cqw}
.vC .cta{align-self:center}

/* ---------- HOW B: realistic iPhone photo, steps around it, one screen tall ---------- */
.howB{display:block;padding:5cqw var(--g) 5cqw;min-height:0}
.howB .h2{text-align:center;max-width:none;margin:0 auto}
.howB .stageB{position:relative;margin-top:2.6cqw;height:44cqw}

.howB .ph>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;-webkit-mask:linear-gradient(90deg,transparent,#000 17%,#000 83%,transparent),linear-gradient(transparent,#000 7%,#000 93%,transparent);-webkit-mask-composite:source-in;mask:linear-gradient(90deg,transparent,#000 17%,#000 83%,transparent),linear-gradient(transparent,#000 7%,#000 93%,transparent);mask-composite:intersect}
.howB .scr{position:absolute;container-type:inline-size;overflow:hidden;background:#0b0f17;direction:rtl}

.howB .step.s2::after{right:-8cqw;background:linear-gradient(90deg,#1A5CFF88,transparent)}

/* ---------- FORM B: split card ---------- */
.fB{padding:7cqw var(--g)}
.fsplit{position:relative;z-index:1;width:100%;display:grid;grid-template-columns:1.1fr 1fr;border-radius:2.8cqw;overflow:hidden;background:#fff;box-shadow:0 2.8cqw 5.6cqw -2cqw #050B1A8c,0 0 6cqw -2cqw #1A5CFF66}

/* ---------- FORM C: one compact strip in the glow gradient ---------- */

.strip{position:relative;border-radius:2.8cqw;padding:3.4cqw 4cqw;background:linear-gradient(120deg,#1A5CFF 0%,#3D8BFF 55%,#8ED3FF 120%);overflow:hidden;box-shadow:0 3cqw 6cqw -2cqw #1A5CFF80}

/* stories A: spotlight */
.sa-stage{position:relative;display:grid;margin-top:3cqw;text-align:right}
.sa-st{grid-area:1/1;display:grid;grid-template-columns:1.15fr 1fr;gap:3cqw;align-items:stretch;opacity:0;visibility:hidden;transform:translateY(1cqw);transition:opacity .5s,transform .5s,visibility .5s}
.sa-st.on{opacity:1;visibility:visible;transform:none}
.sa-q{position:relative;border-radius:2.2cqw;padding:3cqw 3.2cqw;color:#fff;display:flex;flex-direction:column;justify-content:space-between;gap:2cqw;overflow:hidden;
  background:radial-gradient(70% 60% at 100% 0%,#8ED3FF80,transparent 70%),linear-gradient(150deg,#3D8BFF,#1A5CFF 55%,#0B3BBF);box-shadow:0 2.6cqw 5cqw -3cqw #1A5CFFcc}
.sa-q::before{content:"";position:absolute;inset:0;background-image:radial-gradient(#ffffff26 1px,transparent 1.2px);background-size:1.4cqw 1.4cqw;-webkit-mask:linear-gradient(200deg,#000,transparent 60%);mask:linear-gradient(200deg,#000,transparent 60%)}
.sa-mk{position:relative;font-size:9cqw;line-height:.6;font-weight:900;color:#ffffff59;height:4cqw}
.sa-q p{position:relative;margin:0;font-size:2.7cqw;line-height:1.22;font-weight:900;text-wrap:balance}
.sa-who{position:relative;display:flex;align-items:center;gap:1.1cqw}
.sa-who .sLg{background:#FFFFFF;color:#1A5CFF;box-shadow:none}
.sa-who b{display:block;font-size:max(1.5cqw,17px);font-weight:900}.sa-who small{display:block;font-size:max(1.05cqw,14px);color:#EAF4FF}
.sa-side{display:flex;flex-direction:column;gap:1.4cqw}
.sa-num{display:flex;align-items:baseline;gap:1.2cqw;padding:0 .4cqw}
.sa-num b{font-size:6.4cqw;line-height:1;font-weight:900;background:linear-gradient(160deg,#3D8BFF,#1A5CFF 55%,#0B1F4D);-webkit-background-clip:text;background-clip:text;color:transparent}
.sa-num span{font-size:max(1.35cqw,16px);font-weight:700;color:#0B1F4D;max-width:14cqw;line-height:1.3}
.sa-ba{display:grid;grid-template-columns:1fr auto 1fr;gap:1.2cqw;align-items:stretch;padding:1.6cqw;border-radius:1.6cqw;background:#FFFFFF;box-shadow:0 0 0 1px #1A5CFF24,0 1.6cqw 3cqw -2cqw #0B1F4D59}
.sa-ba i,.sa-ex i{display:block;font-style:normal;font-size:max(.95cqw,13.5px);font-weight:700;color:#1A5CFF;margin-bottom:.4cqw}
.sa-ba div:first-child i{color:#647AA8}
.sa-ba p,.sa-ex p{margin:0;font-size:max(1.12cqw,15.5px);line-height:1.55;color:#1C2D57}
.sa-ar{width:1px;background:linear-gradient(#1A5CFF00,#1A5CFF66,#1A5CFF00)}
.sa-ex{padding:1.6cqw;border-radius:1.6cqw;background:#EAF4FF}
.sa-pick{display:flex;justify-content:center;flex-wrap:wrap;gap:.8cqw;margin-top:2.6cqw}
.sa-pb{position:relative;display:flex;align-items:center;gap:.8cqw;font:inherit;font-size:max(1.1cqw,14.5px);font-weight:700;color:#0B1F4D;background:#FFFFFF;border:0;border-radius:99px;padding:.5cqw 1.4cqw .5cqw .6cqw;cursor:pointer;box-shadow:0 0 0 1px #1A5CFF26;overflow:hidden;transition:box-shadow .3s}
.sa-pb .sLg{width:2.4cqw;height:2.4cqw;font-size:1.1cqw;border-radius:50%}
.sa-pb.on{box-shadow:0 0 0 2px #1A5CFF,0 1cqw 2cqw -1.2cqw #1A5CFF}
.sa-pb em{position:absolute;left:0;right:0;bottom:0;height:3px;opacity:0}
.sa-pb em i{display:block;height:100%;width:0;background:#1A5CFF}
.sa-pb.on em{opacity:1}.sa-pb.on em i{animation:prg 7s linear forwards}
@keyframes prg{to{width:100%}}

/* stories B: Echo summary cards */
.sb-wall{display:grid;grid-template-columns:repeat(3,1fr);gap:1.8cqw;margin-top:3cqw;align-items:start;text-align:right}
.sb-card.r1{margin-top:3cqw}.sb-card.r2{margin-top:1.4cqw}
.sb-card{border-radius:1.8cqw;background:#FFFFFF;padding:1.5cqw 1.6cqw 1.4cqw;box-shadow:0 0 0 1px #1A5CFF24,0 1.8cqw 3.4cqw -2.2cqw #0B1F4D59;transition:transform .35s,box-shadow .35s}
.sb-card:hover{transform:translateY(-.4cqw);box-shadow:0 0 0 1.5px #1A5CFF,0 2.4cqw 4cqw -2.4cqw #1A5CFF99}
.sb-hd{display:flex;align-items:center;gap:.9cqw;padding-bottom:1.1cqw;border-bottom:1px solid #1A5CFF1f}
.sb-hd .ch{width:2.8cqw;flex:none}
.sb-hd b{display:block;font-size:max(1.2cqw,15.5px);font-weight:900;color:#0B1F4D}
.sb-hd small{display:block;margin-top:.1cqw;font-size:max(.92cqw,13px);color:#647AA8}
.sb-rows{display:flex;flex-direction:column;gap:.9cqw;padding:1.2cqw 0}
.sb-r{display:grid;grid-template-columns:6.4cqw 1fr;gap:1cqw;align-items:baseline}
.sb-r i{font-style:normal;font-size:max(.92cqw,13px);font-weight:700;color:#647AA8}
.sb-r span{font-size:max(1.08cqw,15px);line-height:1.55;color:#1C2D57}
.sb-r.hi i{color:#1A5CFF}.sb-r.hi span{font-weight:700;color:#0B1F4D}
.sb-done{display:flex;align-items:center;gap:.8cqw;padding:.9cqw 1.1cqw;border-radius:1.1cqw;background:#EAF4FF}
.sb-ck{width:1.7cqw;height:1.7cqw;flex:none;border-radius:.5cqw;background:#1A5CFF;display:grid;place-items:center}
.sb-ck::after{content:"";width:.45cqw;height:.8cqw;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.sb-done b{font-size:max(1.5cqw,18px);font-weight:900;color:#1A5CFF}
.sb-done span{font-size:max(1cqw,14px);font-weight:700;color:#0B1F4D}

/* stories C: results first */
.sc-grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:auto;gap:1.4cqw;margin-top:3cqw;text-align:right}
.sc-t{position:relative;display:flex;flex-direction:column;gap:1cqw;padding:1.8cqw;border-radius:1.8cqw;background:#FFFFFF;box-shadow:0 0 0 1px #1A5CFF24,0 1.6cqw 3cqw -2cqw #0B1F4D4d;cursor:pointer;transition:box-shadow .3s}
.sc-t:hover{box-shadow:0 0 0 1.5px #1A5CFF,0 1.6cqw 3cqw -2cqw #1A5CFF99}
.sc-t.big{grid-column:span 2;grid-row:span 2;color:#fff;background:radial-gradient(70% 60% at 100% 0%,#8ED3FF80,transparent 70%),linear-gradient(150deg,#3D8BFF,#1A5CFF 55%,#0B3BBF);box-shadow:0 2.4cqw 4.6cqw -2.8cqw #1A5CFFcc;padding:2.6cqw}
.sc-n b{display:block;font-size:4.4cqw;line-height:1;font-weight:900;background:linear-gradient(160deg,#3D8BFF,#1A5CFF 55%,#0B1F4D);-webkit-background-clip:text;background-clip:text;color:transparent}
.sc-n span{display:block;margin-top:.4cqw;font-size:max(1.08cqw,14.5px);font-weight:700;color:#0B1F4D}
.sc-c{margin:0;font-size:max(1.08cqw,15px);line-height:1.55;color:#1C2D57}
.sc-more{display:none}
.sc-who{margin-top:auto;display:flex;align-items:center;gap:.8cqw;padding-top:1cqw;border-top:1px solid #1A5CFF1f}
.sc-who .sLg{width:2.8cqw;height:2.8cqw;font-size:1.3cqw;border-radius:.8cqw}
.sc-who b{display:block;font-size:max(1.12cqw,15px);font-weight:900;color:#0B1F4D}.sc-who small{display:block;font-size:max(.9cqw,13px);color:#647AA8}
.sc-t.big .sc-n b{font-size:7.6cqw;background:none;color:#fff;-webkit-text-fill-color:#fff}
.sc-t.big .sc-n span{font-size:max(1.4cqw,17px);color:#EAF4FF}
.sc-t.big .sc-c{font-size:2.1cqw;line-height:1.25;font-weight:900;color:#fff}
.sc-t.big .sc-more{display:flex;flex-direction:column;gap:.6cqw}
.sc-t.big .sc-more p{margin:0;font-size:max(1.12cqw,15px);line-height:1.55;color:#EAF4FF}
.sc-t.big .sc-more i{font-style:normal;font-weight:700;color:#fff}
.sc-t.big .sc-x{padding:1cqw 1.2cqw;border-radius:1cqw;background:#FFFFFF1f}
.sc-t.big .sc-who{border-top-color:#ffffff33}
.sc-t.big .sc-who .sLg{background:#fff;color:#1A5CFF}
.sc-t.big .sc-who b{color:#fff}.sc-t.big .sc-who small{color:#EAF4FF}

/* FAQ A: ask Echo */
.fA2{text-align:center}
.fa-win{max-width:62cqw;margin:3cqw auto 0;text-align:right;border-radius:2.2cqw;background:#FFFFFF;box-shadow:0 0 0 1px #1A5CFF26,0 3cqw 5cqw -3cqw #0B1F4D66;overflow:hidden}
.fa-top{display:flex;align-items:center;gap:1cqw;padding:1.3cqw 1.8cqw;background:linear-gradient(180deg,#F4F8FF,#FFFFFF);border-bottom:1px solid #1A5CFF1a}
.fa-top .ch{width:3cqw}
.fa-top b{display:block;font-size:max(1.3cqw,16px);font-weight:900;color:#0B1F4D}.fa-top small{display:block;font-size:max(.95cqw,13px);color:#647AA8}
.fa-chat{display:flex;flex-direction:column;gap:1.2cqw;padding:2cqw 1.8cqw;min-height:16cqw;background:radial-gradient(60% 80% at 0% 100%,#EAF4FF,transparent 70%)}
.fa-me{align-self:flex-start;max-width:75%;background:#1A5CFF;color:#fff;border-radius:1.6cqw 1.6cqw 1.6cqw .3cqw;padding:1cqw 1.4cqw;font-size:max(1.2cqw,15.5px);font-weight:700;line-height:1.45}
.fa-ec{align-self:flex-end;display:flex;gap:.9cqw;align-items:flex-start;max-width:88%}
.fa-ec .ch{width:3cqw;flex:none}
.fa-ans{margin:0;background:#F4F8FF;border-radius:1.6cqw 1.6cqw .3cqw 1.6cqw;padding:1.2cqw 1.5cqw;font-size:max(1.15cqw,15.5px);line-height:1.7;color:#1C2D57;box-shadow:0 0 0 1px #1A5CFF1a;min-height:3cqw}
.fa-ans .cur{display:inline-block;width:2px;height:1.1em;background:#1A5CFF;vertical-align:-.15em;margin-inline-start:2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.fa-chips{display:flex;flex-wrap:wrap;gap:.7cqw;padding:1.4cqw 1.8cqw 1.8cqw;border-top:1px solid #1A5CFF1a}
.fa-c{font:inherit;font-size:max(1.02cqw,14px);font-weight:700;color:#1A5CFF;background:#EAF4FF;border:0;border-radius:99px;padding:.65cqw 1.2cqw;cursor:pointer;transition:background .25s,color .25s}
.fa-c:hover{background:#D6E7FF}.fa-c.on{background:#1A5CFF;color:#fff}

/* FAQ B: short answer up front */
.fB2{text-align:center}
.fb-list{max-width:64cqw;margin:3cqw auto 0;text-align:right;border-top:1px solid #1A5CFF26}
.fb-i{border-bottom:1px solid #1A5CFF26}
.fb-i summary{list-style:none;display:grid;grid-template-columns:1fr auto auto;gap:1.6cqw;align-items:center;padding:1.7cqw .4cqw;cursor:pointer}
.fb-i summary::-webkit-details-marker{display:none}
.fb-q{font-size:max(1.55cqw,17.5px);font-weight:900;line-height:1.3;color:#0B1F4D}
.fb-s{font-size:max(1.02cqw,14px);font-weight:700;color:#1A5CFF;background:#EAF4FF;border-radius:99px;padding:.45cqw 1.1cqw;white-space:nowrap;transition:background .3s,color .3s}
.fb-pm{position:relative;width:2.4cqw;height:2.4cqw;border-radius:50%;box-shadow:0 0 0 1.5px #1A5CFF4d;transition:background .3s,transform .4s}
.fb-pm::before,.fb-pm::after{content:"";position:absolute;left:50%;top:50%;width:40%;height:2px;border-radius:2px;background:#1A5CFF;transform:translate(-50%,-50%)}
.fb-pm::after{transform:translate(-50%,-50%) rotate(90deg)}
.fb-i[open] .fb-pm{background:#1A5CFF;transform:rotate(45deg)}.fb-i[open] .fb-pm::before,.fb-i[open] .fb-pm::after{background:#fff}
.fb-i[open] .fb-s{background:#1A5CFF;color:#fff}
.fb-i p{margin:0;padding:0 .4cqw 1.9cqw;max-width:52cqw;font-size:max(1.2cqw,16px);line-height:1.7;color:#1C2D57}

/* FAQ C: questions + big answer panel */
.fC2{text-align:center}
.fc-g{display:grid;grid-template-columns:1fr 1.15fr;gap:2.4cqw;margin-top:3cqw;text-align:right;align-items:stretch}
.fc-qs{display:flex;flex-direction:column}
.fc-q{display:flex;align-items:center;justify-content:space-between;gap:1.4cqw;text-align:right;font:inherit;font-size:max(1.35cqw,16.5px);font-weight:700;line-height:1.35;color:#4A5F8C;background:none;border:0;border-bottom:1px solid #1A5CFF1f;padding:1.4cqw .6cqw;cursor:pointer;transition:color .3s}
.fc-q em{flex:none;width:1.1cqw;height:1.1cqw;border:solid #1A5CFF59;border-width:0 0 2px 2px;transform:rotate(45deg);transition:border-color .3s,transform .3s}
.fc-q.on{color:#0B1F4D;font-weight:900}.fc-q.on em{border-color:#1A5CFF;transform:rotate(45deg) translate(-.3cqw,.3cqw)}
.fc-q:hover{color:#0B1F4D}
.fc-pan{position:relative;display:grid;border-radius:2.2cqw;padding:2.8cqw 3cqw;
  background:radial-gradient(60% 70% at 100% 0%,#8ED3FF66,transparent 70%),linear-gradient(160deg,#EAF4FF,#F7FBFF);box-shadow:0 0 0 1px #1A5CFF26,0 2.4cqw 4.4cqw -2.8cqw #0B1F4D59}
.fc-a{grid-area:1/1;opacity:0;visibility:hidden;transform:translateY(.8cqw);transition:opacity .4s,transform .4s,visibility .4s}
.fc-a.on{opacity:1;visibility:visible;transform:none}
.fc-a b{display:block;font-size:2.8cqw;line-height:1.15;font-weight:900;background:linear-gradient(100deg,#0B1F4D,#1A5CFF 60%,#3D8BFF);-webkit-background-clip:text;background-clip:text;color:transparent}
.fc-a p{margin:1.4cqw 0 0;font-size:max(1.25cqw,16px);line-height:1.75;color:#1C2D57}
.fc-pan .cta{grid-area:2/1;justify-self:start;margin-top:2.4cqw}

.wf-win{border-radius:.5cqw 1.8cqw 1.8cqw 1.8cqw}
@container pg (max-width:860px){
  .pl-c[data-p="0"]{border-radius:min(5.4cqw,22px) min(5.4cqw,22px) min(5.4cqw,22px) min(1.4cqw,6px)}
  .pl-c[data-p="0"]::after{bottom:min(-4cqw,-16px);width:min(8cqw,32px);height:min(4.4cqw,18px)}
  .pl-c[data-p="1"]{transform:translateY(min(-4.6cqw,-18px)) translateX(min(2.4cqw,10px)) scale(.94) rotate(-2.4deg)}
  .pl-c[data-p="2"]{transform:translateY(min(-8.6cqw,-34px)) translateX(max(-2.4cqw,-10px)) scale(.88) rotate(2.6deg)}
  .tst .win{margin-top:min(26cqw,104px);border-radius:min(6cqw,24px) min(6cqw,24px) min(6cqw,24px) min(1.6cqw,6px)}
  .tst .win::after{bottom:min(-5cqw,-20px);width:min(9cqw,36px);height:min(5cqw,20px)}
  .tst .rail{margin-top:min(-22cqw,-88px)}
  .wf-qs{border-radius:min(6cqw,24px) min(1.6cqw,6px) min(6cqw,24px) min(6cqw,24px)}
}
.plx>.rings{position:absolute}
.tst .win{margin-top:13cqw}
.tst .rail{margin-top:-11.4cqw}
@container pg (max-width:860px){.tst .win{margin-top:min(30cqw,120px)}.tst .rail{margin-top:min(-26cqw,-104px)}}
.wf-box{backdrop-filter:none!important}
.tst .win{display:flow-root}
/* no speech-bubble tails on boxes (Alon, 29.10.2026) */
.pl-c[data-p="0"]::after,.tst .win::after{content:none!important}
.pl-c[data-p="0"]{border-radius:2.4cqw}
.tst .win{border-radius:2.6cqw}
@container pg (max-width:860px){.pl-c[data-p="0"]{border-radius:min(5.4cqw,22px)}.tst .win{border-radius:min(6cqw,24px)}}

/* ===== 04 pain ===== */
.pn{position:relative;overflow:clip;padding:6cqw var(--g) 5cqw;color:#0B1F4D;
  background:radial-gradient(35% 30% at 100% 6%,#EAF4FF,transparent 70%),radial-gradient(30% 25% at 0% 40%,#EAF4FF,transparent 70%),linear-gradient(180deg,#FFFFFF 0%,#F4F8FF 55%,#E3EEFF 100%)}
.pn::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(#1A5CFF0d 1px,transparent 1px),linear-gradient(90deg,#1A5CFF0d 1px,transparent 1px);background-size:4.4cqw 4.4cqw;-webkit-mask:radial-gradient(60% 30% at 50% 45%,#000,transparent 80%);mask:radial-gradient(60% 30% at 50% 45%,#000,transparent 80%)}
.pn>*:not(.rings){position:relative;z-index:1}
.pn .rings path{stroke:#3D8BFF;stroke-width:1.3}
.pn p{margin:0;font-size:max(1.3cqw,17px);line-height:1.75;color:#1C2D57}
.pn b{font-weight:700;color:#0B1F4D}
.pn mark{background:linear-gradient(transparent 58%,#8ED3FF80 58%);color:#0B1F4D;font-weight:700;padding:0 .1em}
.pn .nx-h{text-align:right;margin-bottom:1.8cqw}
.pn-a{display:grid;grid-template-columns:1.05fr .95fr;gap:4cqw;align-items:center}
.pn-txt p+p{margin-top:1.2cqw}
/* the live call scene */
.pn-scene{position:relative;height:30cqw}
.pn-call{position:absolute;right:6%;top:6%;width:62%;padding:1.8cqw 2cqw;border-radius:2cqw;color:#fff;background:radial-gradient(70% 70% at 100% 0%,#1A5CFF80,transparent 70%),linear-gradient(160deg,#163C88,#0B1F4D 60%,#081633);box-shadow:0 3cqw 5cqw -2.6cqw #0B1F4Dcc;transform:rotate(1.5deg)}
.pn-live{display:flex;align-items:center;gap:.5cqw;font-size:max(.95cqw,13px);font-weight:700;color:#8ED3FF}
.pn-live i{width:.6cqw;height:.6cqw;border-radius:50%;background:#2BD66F;box-shadow:0 0 0 3px #2BD66F33}
.pn-call b{display:block;margin-top:.5cqw;font-size:max(1.7cqw,20px);font-weight:900}
.pn-tm{display:block;font-size:max(1cqw,13.5px);color:#C9D8F5;direction:ltr;text-align:right}
.pn-wv{display:flex;align-items:center;gap:.25cqw;height:2.4cqw;margin-top:1cqw;direction:ltr}
.pn-wv i{flex:1;border-radius:2px;background:#8ED3FF;height:calc(var(--h) * 1%);animation:pnw .8s ease-in-out var(--d) infinite alternate}
@keyframes pnw{to{transform:scaleY(.35)}}
.pn-note{position:absolute;left:2%;top:0;width:42%;padding:1.2cqw 1.4cqw;border-radius:.6cqw;background:#FFF6C9;box-shadow:0 1.6cqw 3cqw -1.6cqw #0B1F4D73;transform:rotate(-5deg);font-family:inherit}
.pn-nh{display:block;font-size:max(.85cqw,12px);font-weight:700;color:#A68A1A;margin-bottom:.4cqw}
.pn-note p{font-size:max(1.05cqw,14px);line-height:1.5;color:#3A3420}
.pn-note p.x{text-decoration:line-through;text-decoration-color:#C0392B99;color:#8A7F5A}
.pn-cur{display:inline-block;width:2px;height:1.1cqw;background:#3A3420;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.pn-self{position:absolute;left:8%;bottom:6%;width:46%;padding:1cqw 1.2cqw .7cqw;border-radius:1.2cqw 1.2cqw .3cqw 1.2cqw;background:#D9FDD3;box-shadow:0 1.4cqw 2.6cqw -1.6cqw #0B1F4D59;transform:rotate(2deg)}
.pn-sh{display:block;font-size:max(.85cqw,12px);font-weight:700;color:#1F8A4C}
.pn-self p{font-size:max(1.05cqw,14px);line-height:1.45;color:#111B21;margin-top:.2cqw}
.pn-self em{display:block;text-align:left;font-style:normal;font-size:max(.8cqw,11.5px);color:#667781}
.pn-in{position:absolute;right:0;bottom:0;display:flex;align-items:center;gap:1cqw;padding:.9cqw 1.1cqw;border-radius:99px;background:#FFFFFF;box-shadow:0 0 0 1px #1A5CFF26,0 1.6cqw 3cqw -1.6cqw #0B1F4D73;animation:pnin 2.4s ease-in-out infinite}
@keyframes pnin{0%,100%{transform:translateY(0)}50%{transform:translateY(-.5cqw)}}
.pn-ring{width:2.6cqw;height:2.6cqw;border-radius:50%;background:#2BD66F;box-shadow:0 0 0 0 #2BD66F80;animation:pnr 1.2s ease-out infinite}
@keyframes pnr{to{box-shadow:0 0 0 1.4cqw #2BD66F00}}
.pn-in small{display:block;font-size:max(.85cqw,12px);color:#647AA8}.pn-in b{display:block;font-size:max(1.1cqw,14.5px)}
.pn-acc{width:2.6cqw;height:2.6cqw;border-radius:50%;background:#FF3B30}
/* the big line */
.pn-big{margin:5cqw auto 0!important;max-width:60cqw;text-align:center;font-size:2.6cqw!important;line-height:1.25!important;font-weight:200;color:#0B1F4D!important;text-wrap:balance}
.pn-big .gr{font-weight:900;background:linear-gradient(100deg,#0B1F4D,#1A5CFF 60%,#3D8BFF);-webkit-background-clip:text;background-clip:text;color:transparent}
/* the tangle */
.pn-mess{position:relative;height:28cqw;margin-top:2cqw}
.pn-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pn-svg path{fill:none;stroke:#1A5CFF;stroke-width:2;stroke-linecap:round;opacity:.55;stroke-dasharray:1400;stroke-dashoffset:1400;transition:stroke-dashoffset 2.4s cubic-bezier(.4,0,.2,1)}
.pn-svg path.t{stroke:#3D8BFF;opacity:.3;stroke-dasharray:6 8;stroke-dashoffset:0;transition:none;animation:pnt 6s linear infinite}
@keyframes pnt{to{stroke-dashoffset:-140}}
.pn.in .pn-svg path:not(.t){stroke-dashoffset:0}
.pn-hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:.2cqw;padding:1.4cqw 2cqw;border-radius:1.8cqw;background:#FFFFFF;box-shadow:0 0 0 1px #1A5CFF26,0 2cqw 4cqw -2cqw #1A5CFF73}
.pn-hub .ch{width:4cqw}
.pn-hub b{font-size:max(1.3cqw,16px);font-weight:900}.pn-hub span{font-size:max(1cqw,13.5px);color:#647AA8}
.pn-it{position:absolute;display:flex;align-items:center;gap:1cqw;max-width:24cqw;padding:1cqw 1.3cqw;border-radius:1.4cqw;background:#FFFFFF;box-shadow:0 0 0 1px #1A5CFF1f,0 1.6cqw 3cqw -1.8cqw #0B1F4D59;font-size:max(1.1cqw,14.5px);font-weight:700;line-height:1.35;color:#0B1F4D;animation:pnf 5s ease-in-out infinite}
.pn-it small{display:block;font-size:max(.85cqw,12px);font-weight:400;color:#647AA8}
.pn-it.i1{right:4%;top:2%;transform:rotate(-3deg)}.pn-it.i2{left:4%;top:4%;transform:rotate(2.5deg);animation-delay:-1.2s}
.pn-it.i3{right:6%;bottom:2%;transform:rotate(2deg);animation-delay:-2.4s}.pn-it.i4{left:5%;bottom:0;transform:rotate(-2.5deg);animation-delay:-3.6s}
@keyframes pnf{50%{translate:0 -.6cqw}}
.pn-ic{flex:none;width:3cqw;height:3cqw;border-radius:.9cqw;display:grid;place-items:center;font-size:max(1.2cqw,15px);font-weight:900;color:#fff}
.pn-ic.cal{background:#FFFFFF;box-shadow:0 0 0 1.5px #1A5CFF59;color:#1A5CFF}.pn-ic.cal i{font-style:normal}
.pn-ic.mis{background:#FF3B30}
.pn-ic.doc{background:linear-gradient(160deg,#EAF4FF,#C9DDFF);clip-path:polygon(0 0,72% 0,100% 26%,100% 100%,0 100%)}
.pn-ic.stk{background:#FFE58A;transform:rotate(-6deg)}
/* the framed line */
.pn-frame{margin:5cqw auto 0;max-width:62cqw;padding:2.4cqw 3cqw;border-radius:2cqw;text-align:center;border:1.5px solid transparent;background:linear-gradient(#FFFFFF,#FFFFFF) padding-box,linear-gradient(120deg,#8ED3FF,#1A5CFF,#0B1F4D) border-box;box-shadow:0 2.6cqw 5cqw -3cqw #1A5CFF80}
.pn-frame p{font-size:2.2cqw!important;line-height:1.3!important;font-weight:400;color:#0B1F4D!important;text-wrap:balance}
.pn-frame .gr{font-weight:900;background:linear-gradient(100deg,#0B1F4D,#1A5CFF);-webkit-background-clip:text;background-clip:text;color:transparent}
/* consequences in sync with the client's messages */
.pn-c{display:grid;grid-template-columns:1fr 30cqw;gap:4cqw;align-items:center;margin-top:4cqw}
.pn-lines{display:flex;flex-direction:column;gap:1.4cqw}
.pn-l{display:grid;grid-template-columns:4cqw 1fr;align-items:baseline;opacity:.45;transition:opacity .4s,transform .4s;transform:translateX(0)}
.pn-l.on{opacity:1;transform:translateX(-.6cqw)}
.pn-n{font-size:2cqw;font-weight:900;color:#1A5CFF}
.pn-chat{border-radius:2cqw;overflow:hidden;background:#EFEAE2;box-shadow:0 0 0 1px #0B1F4D14,0 3cqw 5cqw -3cqw #0B1F4D80;transform:rotate(-1.5deg)}
.pn-ch{display:flex;align-items:center;gap:.8cqw;padding:1cqw 1.3cqw;background:#F0F2F5;border-bottom:1px solid #0B1F4D14}
.pn-av{width:2.6cqw;height:2.6cqw;border-radius:50%;display:grid;place-items:center;background:#C9D8F5;font-weight:900;color:#0B1F4D;font-size:max(1.1cqw,14px)}
.pn-ch b{display:block;font-size:max(1.1cqw,14.5px)}.pn-ch small{display:block;font-size:max(.85cqw,12px);color:#667781}
.pn-msgs{display:flex;flex-direction:column;gap:.7cqw;padding:1.3cqw;min-height:20cqw}
.pn-m{position:relative;align-self:flex-end;max-width:85%;padding:.7cqw 1cqw .4cqw;border-radius:1cqw 1cqw 1cqw .2cqw;background:#FFFFFF;font-size:max(1.05cqw,14px)!important;line-height:1.45!important;color:#111B21!important;box-shadow:0 1px 1px #0B1F4D14;opacity:0;transform:translateY(.8cqw);transition:opacity .4s,transform .4s}
.pn-m.me{align-self:flex-start;background:#D9FDD3;border-radius:1cqw 1cqw .2cqw 1cqw}
.pn-m.late{box-shadow:0 0 0 1.5px #FF3B3080}
.pn-m em{display:block;text-align:left;font-style:normal;font-size:max(.75cqw,11px);color:#667781}
.pn-m.show{opacity:1;transform:none}
.pn-srch{align-self:flex-start;font-size:max(.9cqw,12.5px);font-weight:700;color:#647AA8;opacity:0;transition:opacity .3s}
.pn-srch.show{opacity:1;animation:bl2 1s ease-in-out infinite}
@keyframes bl2{50%{opacity:.4}}
/* the close and Echo coming in */
.pn-end{max-width:66cqw;margin:5cqw auto 0;text-align:center}
.pn-frame2{margin-top:2.6cqw;padding:2cqw 2.6cqw;border-radius:2cqw;background:linear-gradient(160deg,#163C88,#0B1F4D 60%,#081633);box-shadow:0 2.6cqw 5cqw -3cqw #0B1F4Dcc}
.pn-frame2 p{font-size:1.8cqw!important;line-height:1.45!important;color:#EAF4FF!important;font-weight:400}
.pn-frame2 b{color:#FFFFFF;font-weight:900}
.pn-echo{display:flex;align-items:center;gap:2cqw;margin-top:3cqw;text-align:right}
.pn-echo .ch{flex:none;width:7cqw;filter:drop-shadow(0 1.2cqw 1.6cqw #1A5CFF66)}
.pn-echo p{font-size:max(1.4cqw,17px)!important}
/* ===== 06 timeline ===== */
.tlx{position:relative;overflow:clip;padding:6cqw var(--g) 5.4cqw;color:#fff;text-align:center;
  background:radial-gradient(45% 60% at 100% 0%,#8ED3FF73,transparent 70%),radial-gradient(45% 70% at 0% 100%,#0B1F4D73,transparent 70%),linear-gradient(160deg,#3D8BFF,#1A5CFF 50%,#1240C9)}
.tlx::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#ffffff26 1px,transparent 1.2px);background-size:1.6cqw 1.6cqw;-webkit-mask:radial-gradient(70% 70% at 50% 40%,#000,transparent 80%);mask:radial-gradient(70% 70% at 50% 40%,#000,transparent 80%)}
.tlx>*:not(.rings){position:relative;z-index:1}
.tlx .rings path{stroke:#FFFFFF;stroke-width:1.2}
.tlx .nx-h,.tlx .nx-h .th2{color:#FFFFFF}
.tlx .nx-h .gr{background:linear-gradient(100deg,#FFFFFF,#CFE6FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.tl-stage{margin-top:3cqw}
.tl-scenes{display:grid;grid-template-columns:28fr 44fr 28fr;gap:1.6cqw;align-items:end;height:20cqw}
.tl-sc{display:flex;justify-content:center;align-items:flex-end;opacity:.35;transform:translateY(1cqw) scale(.94);transition:opacity .5s,transform .6s cubic-bezier(.3,.9,.3,1);filter:saturate(.6)}
.tlx[data-z="0"] .s0,.tlx[data-z="1"] .s1,.tlx[data-z="2"] .s2{opacity:1;transform:none;filter:none}
.tl-card{width:100%;max-width:30cqw;text-align:right;padding:1.4cqw 1.6cqw;border-radius:1.8cqw;background:#FFFFFF;color:#0B1F4D;box-shadow:0 2.6cqw 4.6cqw -2.4cqw #0B1F4Dcc}
.tl-tag{display:inline-block;font-size:max(.9cqw,12.5px);font-weight:700;color:#1A5CFF;background:#EAF4FF;border-radius:99px;padding:.2cqw .9cqw;margin-bottom:.9cqw}
.tl-con{display:flex;align-items:center;gap:.8cqw}
.tl-con .ch{width:3.4cqw;flex:none}
.tl-link{display:flex;gap:.3cqw}.tl-link i{width:.5cqw;height:.5cqw;border-radius:50%;background:#1A5CFF;animation:wfd 1s ease-in-out infinite}
.tl-link i:nth-child(2){animation-delay:.15s}.tl-link i:nth-child(3){animation-delay:.3s}
@keyframes wfd{0%,100%{opacity:.3}50%{opacity:1}}
.tl-phone small{display:block;font-size:max(.85cqw,12px);color:#647AA8}.tl-phone b{display:block;font-size:max(1.15cqw,15px);direction:ltr;text-align:right}
.tl-st{display:flex;align-items:center;gap:.5cqw;margin-top:1cqw;font-size:max(1cqw,13.5px);font-weight:700;color:#1A5CFF}
.tl-st i{width:.7cqw;height:.7cqw;border-radius:50%;background:#1A5CFF}
.tl-st .b{display:none;color:#1F8A4C}.tlx.cn .tl-st .a{display:none}.tlx.cn .tl-st .b{display:inline}.tlx.cn .tl-st i{background:#2BD66F}
.tl-callh{display:flex;align-items:center;gap:.7cqw}
.tl-rec{width:.8cqw;height:.8cqw;border-radius:50%;background:#FF3B30;animation:bl2 1.2s ease-in-out infinite}
.tl-callh b{font-size:max(1.3cqw,16px);font-weight:900}
.tl-ctm{margin-inline-start:auto;font-size:max(1cqw,13.5px);color:#647AA8;direction:ltr}
.tl-chips{display:flex;flex-direction:column;gap:.6cqw;margin:1cqw 0;min-height:9cqw}
.tl-chip{align-self:flex-start;font-size:max(1.05cqw,14px);line-height:1.4;color:#1C2D57;background:#F4F8FF;border-radius:1cqw;padding:.5cqw .9cqw;opacity:0;transform:translateY(.6cqw);transition:opacity .4s,transform .4s}
.tl-chip b{color:#1A5CFF;font-weight:900}
.tl-chip.show{opacity:1;transform:none}
.tl-lis{display:flex;align-items:center;gap:.6cqw;font-size:max(.95cqw,13px);font-weight:700;color:#1A5CFF}.tl-lis .ch{width:2.2cqw}
.tl-sum b{display:block;font-size:max(1.25cqw,15.5px);font-weight:900}.tl-sum small{display:block;font-size:max(.9cqw,12.5px);color:#647AA8}
.tl-tasks{display:flex;flex-direction:column;gap:.6cqw;margin:1cqw 0}
.tl-tk{display:flex;align-items:center;gap:.7cqw;font-size:max(1.05cqw,14px);color:#1C2D57;opacity:.35;transition:opacity .3s}
.tl-tk i{width:1.4cqw;height:1.4cqw;border-radius:.4cqw;box-shadow:0 0 0 1.5px #1A5CFF80 inset;display:grid;place-items:center;flex:none;transition:background .3s}
.tl-tk.show{opacity:1}.tl-tk.show i{background:#1A5CFF;box-shadow:none}
.tl-tk.show i::after{content:"";width:.4cqw;height:.7cqw;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tl-sent{display:inline-flex;align-items:center;gap:.6cqw;font-size:max(.95cqw,13px);font-weight:700;color:#1F8A4C;background:#E7F8EE;border-radius:99px;padding:.35cqw .9cqw .35cqw .5cqw;opacity:0;transform:scale(.9);transition:opacity .35s,transform .35s}
.tl-sent img{width:1.4cqw;height:1.4cqw;border-radius:50%;background:#25D366;padding:.2cqw}
.tl-sent.show{opacity:1;transform:none}
.tl-axis{position:relative;height:8cqw;margin-top:2.2cqw}
.tl-wave{position:absolute;inset:0;display:flex;align-items:center;gap:.3cqw}
.tl-wave i{flex:1;height:calc(var(--h) * 1%);border-radius:99px;background:#FFFFFF4d;transition:background .2s}
.tl-wave i.on{background:#FFFFFF}
.tl-wave i[data-z="1"].on{background:linear-gradient(#FFFFFF,#CFE6FF)}
.tl-head{position:absolute;top:-1cqw;bottom:-1cqw;width:2px;background:#FFFFFF;box-shadow:0 0 1.2cqw #FFFFFF;right:0;transform:translateX(50%)}
.tl-rider{position:absolute;bottom:100%;left:50%;width:4.6cqw;transform:translate(-50%,-.4cqw);filter:drop-shadow(0 .8cqw 1.2cqw #0B1F4D80)}
.tl-rider .ch{width:100%;display:block}
.tl-mk{position:absolute;top:50%;width:1.2cqw;height:1.2cqw;border-radius:50%;background:#1A5CFF;box-shadow:0 0 0 3px #FFFFFF;transform:translate(50%,-50%)}
.tl-mk.m0{right:0}.tl-mk.m1{right:28%}.tl-mk.m2{right:72%}
.tl-steps{display:grid;grid-template-columns:28fr 44fr 28fr;gap:1.6cqw;margin-top:2cqw;text-align:right}
.tl-s{font:inherit;text-align:right;color:#fff;background:none;border:0;padding:1cqw;border-radius:1.4cqw;cursor:pointer;opacity:.6;transition:opacity .4s,background .4s}
.tlx[data-z="0"] .tl-s[data-z="0"],.tlx[data-z="1"] .tl-s[data-z="1"],.tlx[data-z="2"] .tl-s[data-z="2"]{opacity:1;background:#FFFFFF1f}
.tl-n{display:block;font-size:2.4cqw;font-weight:900;line-height:1;color:#FFFFFF}
.tl-s b{display:block;margin-top:.6cqw;font-size:max(1.4cqw,17px);font-weight:900;line-height:1.3}
.tl-s>span:last-child{display:block;margin-top:.5cqw;font-size:max(1.1cqw,15px);line-height:1.6;color:#EAF4FF}
@container pg (max-width:860px){
  .pn{padding:min(14cqw,56px) var(--g) min(12cqw,48px)}
